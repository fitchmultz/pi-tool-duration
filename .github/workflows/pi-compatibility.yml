name: Pi compatibility

on:
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility / compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi
          ref: main
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            fork/package-lock.json
      - name: Check current official Pi
        working-directory: extension
        shell: bash
        run: |
          npm ci --ignore-scripts
          latest="$(npm view @earendil-works/pi-coding-agent dist-tags.latest)"
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$latest"
          actual="$(node -p 'require("./node_modules/@earendil-works/pi-coding-agent/package.json").version')"
          test "$actual" = "$latest"
          echo "Official Pi: $actual" >> "$GITHUB_STEP_SUMMARY"
          npm run check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Build current maintained fork
        working-directory: fork
        shell: bash
        run: |
          echo "Fork commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          npm ci --ignore-scripts
          npm run hydrate:model-data
          npm run build:offline
      - name: Exercise fork runtime and checkpoint restoration
        working-directory: extension
        env:
          PI_HOST_INDEX: ${{ github.workspace }}/fork/packages/coding-agent/dist/index.js
          PI_REQUIRE_CHECKPOINT: '1'
        run: node --test test/runtime.test.mjs test/checkpoint.test.mjs
