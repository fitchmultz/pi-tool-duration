<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Tool timing for the model, native output for you</title>
  <desc id="desc">Pi runs a tool. pi-tool-duration observes its execution events and saves elapsed time in a hidden session entry. Eligible results receive a timing marker in model-request copies. The terminal keeps Pi's native output.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060A12"/>
      <stop offset="0.52" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#080C16"/>
    </linearGradient>
    <radialGradient id="blueBloom" cx="0.2" cy="0.2" r="0.8">
      <stop stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetBloom" cx="0.78" cy="0.4" r="0.7">
      <stop stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#172238" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0E1525" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172554" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0.58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#02040A" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#86EFAC"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .title { font-size: 34px; font-weight: 650; fill: #F8FAFC; }
      .copy { font-size: 26px; fill: #B9C7DD; }
      .chip { font-size: 20px; font-weight: 650; letter-spacing: 1px; }
      .connector { fill: none; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Opaque canvas and restrained depth use the fleet's dark design tokens. -->
  <rect width="1600" height="700" fill="url(#canvas)"/>
  <rect width="1600" height="700" fill="url(#blueBloom)"/>
  <rect width="1600" height="700" fill="url(#violetBloom)"/>
  <g class="sans">
    <text x="64" y="92" font-size="48" font-weight="700" letter-spacing="-1" fill="#F8FAFC">Give the model a sense of time</text>
    <text x="64" y="140" font-size="28" fill="#B9C7DD">Tool output stays intact. Elapsed time travels with the model's copy.</text>
  </g>

  <!-- Execution events feed measurement; only request copies get a marker. -->
  <path d="M392 352H480" class="connector" stroke="#60A5FA" marker-end="url(#arrowBlue)"/>
  <path d="M952 352H1064" class="connector" stroke="#A78BFA" marker-end="url(#arrowViolet)"/>
  <!-- Native output follows its own path, independently of annotation. -->
  <path d="M228 488V556" class="connector" stroke="#86EFAC" marker-end="url(#arrowGreen)"/>

  <g class="sans" filter="url(#shadow)">
    <g transform="translate(64 210)">
      <rect width="328" height="278" rx="24" fill="url(#glass)" stroke="#2A3851"/>
      <rect x="28" y="28" width="52" height="52" rx="14" fill="#60A5FA" fill-opacity="0.12"/>
      <path d="m42 46 10 8-10 8m18 0h10" fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="124" class="title">Pi runs a tool</text>
      <text x="28" y="168" class="mono" font-size="24" fill="#BFDBFE">sleep 1; echo hi</text>
      <text x="28" y="224" class="copy">Output: <tspan class="mono" fill="#F8FAFC">hi</tspan></text>
    </g>

    <g transform="translate(480 210)">
      <rect width="472" height="278" rx="26" fill="url(#focus)" stroke="#6D7DFF" stroke-opacity="0.55"/>
      <circle cx="54" cy="54" r="25" fill="#A78BFA" fill-opacity="0.15"/>
      <circle cx="54" cy="54" r="15" fill="none" stroke="#DDD6FE" stroke-width="2.5"/>
      <path d="M54 44v11l8 5" fill="none" stroke="#DDD6FE" stroke-width="2.5" stroke-linecap="round"/>
      <text x="92" y="62" class="mono" font-size="23" fill="#DDD6FE">pi-tool-duration</text>
      <text x="28" y="124" class="title">Measure the call</text>
      <text x="28" y="168" class="copy">Start → end, rounded to 0.1s</text>
      <rect x="28" y="198" width="264" height="42" rx="21" fill="#111A2A" stroke="#51426F"/>
      <text x="160" y="225" text-anchor="middle" class="mono chip" fill="#DDD6FE">SAVED IN SESSION</text>
    </g>

    <g transform="translate(1064 210)">
      <rect width="472" height="278" rx="24" fill="url(#glass)" stroke="#2A3851"/>
      <rect x="28" y="28" width="52" height="52" rx="14" fill="#86EFAC" fill-opacity="0.12"/>
      <path d="M41 42h26v18H53l-8 7v-7h-4Z" fill="none" stroke="#86EFAC" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="28" y="124" class="title">Model receives</text>
      <text x="28" y="168" class="mono" font-size="26" fill="#F8FAFC">hi</text>
      <text x="28" y="210" class="mono" font-size="24" fill="#86EFAC">[host tool-call elapsed: 1.0s]</text>
      <text x="28" y="250" font-size="23" fill="#B9C7DD">Example: a one-second tool call</text>
    </g>

    <g transform="translate(64 556)">
      <rect width="1472" height="92" rx="22" fill="url(#glass)" stroke="#243148"/>
      <rect x="28" y="20" width="52" height="52" rx="14" fill="#86EFAC" fill-opacity="0.1"/>
      <path d="M39 31h30v21H39Zm9 29h12" fill="none" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round"/>
      <text x="104" y="57" font-size="30" font-weight="600" fill="#F8FAFC">Your terminal keeps Pi's native tool output</text>
      <rect x="1012" y="24" width="432" height="44" rx="22" fill="#0C1D19" stroke="#285446"/>
      <text x="1228" y="53" text-anchor="middle" class="mono chip" fill="#86EFAC">NO EXTRA TIMING LINE</text>
    </g>
  </g>
</svg>
